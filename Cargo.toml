[package]
name = "voxel-world"
version = "0.1.0"
edition = "2024"

# Tests and benchmarks live together under `testing/` rather than in Cargo's
# default `tests/` and `benches/`, so each one is declared below. Turning the
# automatic discovery off means a stray `tests/` folder can never be picked up
# as well.
autotests = false
autobenches = false

[dependencies]
# Operating-system entropy for worlds that were not given a seed.
getrandom = "0.3.4"

# The window and Vulkan, used only by the binary in `src/main.rs`; the library
# itself calls none of them.
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"

[[test]]
name = "sampling"
path = "testing/tests/sampling.rs"

[[test]]
name = "exact_sampling"
path = "testing/tests/exact_sampling.rs"

[[test]]
name = "rota"
path = "testing/tests/rota.rs"

[[test]]
